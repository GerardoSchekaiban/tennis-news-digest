# Sources to fetch. Add, remove and tune freely.

rss:
  # TODO (milestone 1): find RSS feeds for tennis news and list them here.
  # Hint: many news sites expose a feed at /rss, /feed or in the page's <link rel="alternate">.
  - name: example-feed
    url: https://example.com/tennis/rss

youtube:
  # Every channel has a feed at https://www.youtube.com/feeds/videos.xml?channel_id=<ID>
  # To find a channel's ID: open the channel page, View Source, search for "channelId"
  # (it starts with "UC"). Add one entry per channel.
  - name: Tennis TV
    channel_id: UC_REPLACE_WITH_REAL_ID
